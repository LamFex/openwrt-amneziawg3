name: Build OpenWrt APKs

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install OpenWrt SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang cmake flex bison gawk gettext libjson-c-dev \
            libncurses-dev file git jq libssl-dev openssl patch pkg-config \
            python3-setuptools ripgrep rsync shellcheck swig unzip zlib1g-dev zstd

      - name: Install pinned security and ucode test tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" \
            go install github.com/zricethezav/gitleaks/v8@v8.30.1
          ./scripts/prepare-ucode-runtime.sh "$RUNNER_TEMP/ucode-exact"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ucode-exact/bin" >> "$GITHUB_PATH"

      - name: Run pre-build secret gate
        env:
          AWG3_REQUIRE_GITLEAKS: '1'
        run: ./scripts/secret-scan.sh

      - name: Run source verification gates
        env:
          AWG3_REQUIRE_UCODE_RUNTIME: '1'
        run: |
          make verify
          ./scripts/verify-upstream.sh
          ./scripts/verify-patches.sh

      - name: Build with the pinned OpenWrt SDK
        run: ./scripts/build-sdk.sh

      - name: Upload test-only feed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: awg3-openwrt-25.12.5-aarch64_cortex-a53-test
          path: dist/
          if-no-files-found: error
          retention-days: 14
