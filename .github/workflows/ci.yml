name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install static-analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes cmake gettext jq libjson-c-dev pkg-config \
            ripgrep shellcheck

      - name: Install pinned security and ucode test tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" \
            go install github.com/zricethezav/gitleaks/v8@v8.30.1
          ./scripts/prepare-ucode-runtime.sh "$RUNNER_TEMP/ucode-exact"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/ucode-exact/bin" >> "$GITHUB_PATH"

      - name: Run pre-build secret gate
        env:
          AWG3_REQUIRE_GITLEAKS: '1'
        run: ./scripts/secret-scan.sh

      - name: Run repository checks
        env:
          AWG3_REQUIRE_UCODE_RUNTIME: '1'
        run: make verify

      - name: Verify pinned upstream archives
        run: ./scripts/verify-upstream.sh

      - name: Verify upstream patches
        run: ./scripts/verify-patches.sh

      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
